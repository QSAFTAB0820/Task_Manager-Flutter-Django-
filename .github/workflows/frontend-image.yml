name: Build and publish Task Manager frontend

on:
  push:
    branches:
      - docker-learning
    paths:
      - 'learning_app_frontend/**'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/qsaftab0820/task-manager-frontend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        working-directory: learning_app_frontend
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: learning_app_frontend
        run: flutter analyze

      - name: Test Flutter app
        working-directory: learning_app_frontend
        run: flutter test

      - name: Build Flutter Web
        working-directory: learning_app_frontend
        run: flutter build web --release --dart-define-from-file=config/prod.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./learning_app_frontend
          file: ./learning_app_frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
