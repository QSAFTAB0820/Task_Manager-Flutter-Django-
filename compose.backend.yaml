services:
  backend:
    build:
      context: ./learning_app_backend
      dockerfile: Dockerfile
    image: task-manager-backend:local
    container_name: task-manager-backend-local
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SQLITE_DB_PATH: /data/db.sqlite3
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
